name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real Postgres (with pgvector) and Redis for the integration and end-to-end suites.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: daydrift
          POSTGRES_PASSWORD: daydrift
          POSTGRES_DB: daydrift
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U daydrift -d daydrift" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://daydrift:daydrift@localhost:5432/daydrift
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: Integration tests (real Postgres and Redis)
        run: pnpm test:integration
      - name: Install browser for end-to-end tests
        run: pnpm --filter @daydrift/e2e exec playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: pnpm --filter @daydrift/e2e e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
