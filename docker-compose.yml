services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: daydrift
      POSTGRES_PASSWORD: daydrift
      POSTGRES_DB: daydrift
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daydrift -d daydrift']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['${REDIS_PORT:-6379}:6379']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
  redisdata:
